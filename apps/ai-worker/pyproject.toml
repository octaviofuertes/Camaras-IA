[project]
name = "percepta-ai-worker"
version = "0.1.0"
description = "Percepta ai-worker: carga módulos PerceptaModule y ejecuta inferencia sobre frames"
requires-python = ">=3.11"
dependencies = [
    "percepta-contracts",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pika>=1.3",            # RabbitMQ (publicación detections.raw)
    "protobuf>=4.25",
    "jsonschema>=4.22",     # validación del manifest contra el meta-schema (CONTRACTS §4)
    "fastapi>=0.111",       # health/metrics endpoint
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gpu = ["ultralytics>=8.2", "torch>=2.3"]
dev = ["pytest>=8.0", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_worker*"]

[tool.uv.sources]
percepta-contracts = { path = "../../packages/py-contracts", editable = true }
